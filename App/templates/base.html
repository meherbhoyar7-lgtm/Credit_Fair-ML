<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Fair — Intelligent Credit Risk Analysis</title>
    <meta name="description" content="Credit Fair uses advanced machine learning to predict credit risk using demographic and financial profiles.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="{% if request.endpoint == 'home' %}page-home-body{% else %}page-inner-body{% endif %}">

    <!-- Global Full-Screen Looping Video Background (Plays on All Pages) -->
    <div class="video-bg-wrap" id="videoBgWrap">
        <video id="bgVideo" autoplay muted loop playsinline preload="auto">
            <source src="{{ url_for('static', filename='videos/jp_morgan_hq_trimmed.mp4') }}" type="video/mp4">
        </video>
        <!-- Force play at DOM-parse time — before DOMContentLoaded — for instant autoplay -->
        <script>
            (function(){
                var v = document.getElementById('bgVideo');
                if (v) { v.muted = true; v.play().catch(function(){}); }
            })();
        </script>
        <div class="video-overlay-gradient"></div>
    </div>

    <!-- Apple-Style Global Navigation Bar (Flush Edge-to-Edge, Frosted Glass, Classic Class) -->
    <header class="apple-global-nav" id="appleGlobalNav">
        <div class="apple-nav-inner">
            <a href="/" class="apple-nav-brand">
                <span class="apple-brand-icon-wrap">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M3 21h18M3 10h18M5 10v11M9 10v11M15 10v11M19 10v11M12 2L2 7h20L12 2z"/>
                    </svg>
                </span>
                <span class="apple-brand-name">Credit Fair</span>
            </a>

            <nav class="apple-nav-menu">
                <a href="/" class="apple-nav-link {% if request.endpoint == 'home' %}active{% endif %}">Home</a>
                <a href="/dataset" class="apple-nav-link {% if request.endpoint == 'dataset' %}active{% endif %}">Dataset</a>
                <a href="/eda" class="apple-nav-link {% if request.endpoint == 'eda' %}active{% endif %}">EDA</a>
                <a href="/preprocess" class="apple-nav-link {% if request.endpoint == 'preprocess' %}active{% endif %}">Preprocessing</a>
                <a href="/models" class="apple-nav-link {% if request.endpoint == 'models' %}active{% endif %}">Models</a>
            </nav>

            <div class="apple-nav-right">
                <a href="/dataset" class="apple-nav-cta-btn">
                    <span>Explore Data</span>
                    <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
                        <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="content {% if request.endpoint == 'home' %}content-home{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-logo">Credit Fair</span>
                <span class="footer-tagline">AI-Powered Credit Risk & Financial Intelligence</span>
            </div>
            <div class="footer-meta">
                <span>Built with Flask &amp; Scikit-Learn</span>
                <span class="footer-dot">·</span>
                <span>JPMorgan 270 Park Ave Exterior Edition</span>
                <span class="footer-dot">·</span>
                <span>2026</span>
            </div>
        </div>
    </footer>

    <script>
        // Apple global navigation subtle backdrop intensification on scroll
        const globalNav = document.getElementById('appleGlobalNav');
        if (globalNav) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 30) {
                    globalNav.classList.add('nav-scrolled');
                } else {
                    globalNav.classList.remove('nav-scrolled');
                }
            });
        }

        // Global background video: guaranteed silent autoplay, no controls, no play button
        const bgVideo = document.getElementById('bgVideo');

        if (bgVideo) {
            // Ensure muted at JS level too (belt + suspenders)
            bgVideo.muted = true;
            bgVideo.volume = 0;
            bgVideo.removeAttribute('poster'); // poster causes Chrome to show the paused overlay

            function tryPlay() {
                bgVideo.play().catch(function() {});
            }

            // 1. Try immediately
            tryPlay();

            // 2. Retry when browser says it has enough data to play
            bgVideo.addEventListener('canplay', tryPlay, { once: true });
            bgVideo.addEventListener('canplaythrough', tryPlay, { once: true });

            // 3. Retry after a short tick (handles timing edge cases)
            setTimeout(tryPlay, 100);
            setTimeout(tryPlay, 500);

            // Restore playback position across page transitions
            try {
                const savedTime = sessionStorage.getItem('cf_bg_video_time');
                if (savedTime && !isNaN(savedTime)) {
                    bgVideo.currentTime = parseFloat(savedTime);
                }
                window.addEventListener('beforeunload', () => {
                    sessionStorage.setItem('cf_bg_video_time', bgVideo.currentTime);
                });
                bgVideo.addEventListener('timeupdate', () => {
                    sessionStorage.setItem('cf_bg_video_time', bgVideo.currentTime);
                });
            } catch(e) {}
        }

        // Scroll reveal animation
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

        revealElements.forEach(el => revealObserver.observe(el));
    </script>
</body>
</html>
